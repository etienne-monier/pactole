[package]
name = "tree-sitter-pactole"
description = "Tree-sitter grammar and Rust bindings for the Pactole ledger language."
version = "0.2.0"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "pactole"]
categories = ["parser-implementations", "parsing", "text-editors"]
edition.workspace = true
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
