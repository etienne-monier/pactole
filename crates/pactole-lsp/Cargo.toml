[package]
name = "pactole-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Language Server Protocol server for Pactole ledgers."
keywords = ["pactole", "lsp", "editor"]
categories = ["development-tools"]

# Build the `pactole-lsp` binary.
[[bin]]
name = "pactole-lsp"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
env_logger.workspace = true
log.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
pactole-config.workspace = true
pactole-core.workspace = true
pactole-storage-fs.workspace = true
pactole-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
# Used directly by `navigation.rs` to locate the CST token under the cursor
# (`Node::descendant_for_byte_range`); same version as `pactole-syntax`.
tree-sitter.workspace = true
