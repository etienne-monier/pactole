[package]
name = "pactole-lsp"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Language Server Protocol server for Pactole ledgers."
keywords = ["pactole", "lsp", "editor"]
categories = ["development-tools"]

# Build the `pactole-lsp` binary.
[[bin]]
name = "pactole-lsp"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.8"
log = "0.4.28"
lsp-server = "0.7.9"
lsp-types = "0.93.2"
pactole-core = { version = "0.1.0", path = "../pactole-core" }
pactole-storage-fs = { version = "0.1.0", path = "../pactole-storage-fs" }
pactole-syntax = { version = "0.1.0", path = "../pactole-syntax" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
