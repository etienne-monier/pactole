[package]
name = "pactole-import"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Import external formats (OFX, ...) into Pactole domain models."
keywords = ["accounting", "ledger", "import", "ofx"]
categories = ["finance", "parser-implementations"]

[dependencies]
chrono = "0.4.45"
encoding_rs = "0.8"
# Pending upstream release: ofx-rs 0.2.0 pins quick-xml below the RustSec-fixed
# version, its SGML normalizer drops BANKTRANLIST when BANKACCTFROM carries
# ACCTKEY, and it mangles non-ASCII text (all three fixed on this fork, upstream
# PR pending).
ofx-rs = { version = "0.2.0", git = "https://github.com/etienne-monier/ofx-rs.git", rev = "ec8e9dc620ceb9d7e4aa56bcac19b03bba057dc2" }
pactole-config = { version = "0.2.0", path = "../pactole-config" }
pactole-core = { version = "0.2.0", path = "../pactole-core" }
rust_decimal = "1.43.0"
thiserror = "2.0.20"
