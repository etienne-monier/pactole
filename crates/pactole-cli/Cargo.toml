[package]
name = "pactole-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Command-line interface for Pactole, a plain-text double-entry accounting ledger."
keywords = ["accounting", "ledger", "cli", "finance"]
categories = ["command-line-utilities", "finance"]

# Build the `pactole` binary (instead of the default `pactole-cli`), so that
# `cargo install --path crates/pactole-cli` gives you a `pactole` command.
[[bin]]
name = "pactole"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
pactole-core = { version = "0.1.0", path = "../pactole-core" }
pactole-import = { version = "0.1.0", path = "../pactole-import" }
pactole-storage-fs = { version = "0.1.0", path = "../pactole-storage-fs" }
toml = "1.1.5"
