[package]
name = "pactole-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Command-line interface for Pactole, a plain-text double-entry accounting ledger."
keywords = ["accounting", "ledger", "cli", "finance"]
categories = ["command-line-utilities", "finance"]

# Build the `pactole` binary (instead of the default `pactole-cli`), so that
# `cargo install --path crates/pactole-cli` gives you a `pactole` command.
[[bin]]
name = "pactole"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
pactole-config.workspace = true
pactole-core.workspace = true
pactole-import.workspace = true
pactole-storage-fs.workspace = true
serde_json.workspace = true

[dev-dependencies]
