# Configuration for `cargo-deny` (https://embarkstudios.github.io/cargo-deny/).
#
# Check the license, security-advisory, ban and source policies of the whole
# dependency graph: `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
# Security advisories from the RustSec database.
version = 2
yanked = "warn"

[licenses]
version = 2
# Confidence threshold (0.0 - 1.0) above which a license is accepted without
# manual review.
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/etienne-monier/ofx-rs"]
