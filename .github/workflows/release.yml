name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          echo "tag=$tag workspace_version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the workspace version $version"
            exit 1
          fi
      # Publishes every crate in dependency order (Cargo 1.90 and later).
      - name: Publish to crates.io
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
